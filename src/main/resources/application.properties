spring.application.name=EMMA-1

# Servidor de la aplicacion (Puerto por defecto)
server.port=8080

# Conexion a MySQL (Ajusta tu usuario y contrasena de MySQL local)
spring.datasource.url=jdbc:mysql://localhost:3306/EmmaDesiTuti?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Desactivar el cache de Thymeleaf para ver los cambios sin reiniciar
spring.thymeleaf.cache=false