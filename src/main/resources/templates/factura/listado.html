<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Facturas - Inmobiliaria</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand"><span>🏠 Inmobiliaria</span></div>
    <ul class="navbar-menu">
        <li><a th:href="@{/propiedades}">Propiedades</a></li>
        <li><a th:href="@{/publicaciones}">Publicaciones</a></li>
        <li><a th:href="@{/contratos}">Contratos</a></li>
        <li><a th:href="@{/facturas}" class="active">Facturas</a></li>
    </ul>
</nav>

<main class="container">

    <div class="page-header">
        <h1>Facturas</h1>
        <a th:href="@{/facturas/nueva}" class="btn btn-primary">+ Nueva Factura</a>
    </div>

    <!-- Mensajes de feedback -->
    <div th:if="${mensajeExito}" class="alerta alerta-exito" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alerta alerta-error" th:text="${mensajeError}"></div>

    <!-- Filtros -->
    <div class="card filtros">
        <h3>Filtrar</h3>
        <form th:action="@{/facturas}" method="get" class="form-filtros">
            <div class="form-row">
                <div class="form-group">
                    <label>Contrato</label>
                    <select name="contratoId" class="form-control">
                        <option value="">Todos</option>
                        <option th:each="c : ${contratos}"
                                th:value="${c.id}"
                                th:text="${c.resumen}"
                                th:selected="${filtroContratoId != null and filtroContratoId == c.id}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Inquilino</label>
                    <select name="inquilinoId" class="form-control">
                        <option value="">Todos</option>
                        <option th:each="p : ${personas}"
                                th:value="${p.id}"
                                th:text="${p.nombreCompleto}"
                                th:selected="${filtroInquilinoId != null and filtroInquilinoId == p.id}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Estado</label>
                    <select name="estado" class="form-control">
                        <option value="">Todos</option>
                        <option th:each="e : ${estados}"
                                th:value="${e.name()}"
                                th:text="${e.descripcion}"
                                th:selected="${filtroEstado != null and filtroEstado == e}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Vencimiento desde</label>
                    <input type="date" name="fechaDesde" class="form-control"
                           th:value="${filtroFechaDesde}"/>
                </div>

                <div class="form-group">
                    <label>Vencimiento hasta</label>
                    <input type="date" name="fechaHasta" class="form-control"
                           th:value="${filtroFechaHasta}"/>
                </div>

                <div class="form-group form-group-actions">
                    <button type="submit" class="btn btn-secondary">Filtrar</button>
                    <a th:href="@{/facturas}" class="btn btn-outline">Limpiar</a>
                </div>
            </div>
        </form>
    </div>

    <!-- Tabla -->
    <div class="card">
        <table class="tabla" th:if="${not #lists.isEmpty(facturas)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Contrato</th>
                    <th>Propiedad</th>
                    <th>Inquilino</th>
                    <th>Concepto</th>
                    <th>Emisión</th>
                    <th>Vencimiento</th>
                    <th>Importe</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${facturas}">
                    <td th:text="${f.id}"></td>
                    <td th:text="${'#' + f.contrato.id}"></td>
                    <td th:text="${f.contrato.propiedad.resumen}"></td>
                    <td th:text="${f.contrato.inquilino.nombreCompleto}"></td>
                    <td th:text="${f.conceptoFacturado}"></td>
                    <td th:text="${#temporals.format(f.fechaEmision, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(f.fechaVencimiento, 'dd/MM/yyyy')}"></td>
                    <td th:text="${'$' + #numbers.formatDecimal(f.importe, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${f.estado.name().toLowerCase()}"
                              th:text="${f.estado.descripcion}">
                        </span>
                    </td>
                    <td class="acciones">
                        <a th:href="@{/facturas/{id}/editar(id=${f.id})}"
                           th:if="${f.estado.name() != 'ANULADA' and f.estado.name() != 'PAGADA'}"
                           class="btn btn-sm btn-secondary">Editar</a>

                        <form th:action="@{/facturas/{id}/eliminar(id=${f.id})}" method="post"
                              style="display:inline"
                              onsubmit="return confirm('¿Eliminar esta factura?')">
                            <button type="submit"
                                    th:if="${f.estado.name() != 'PAGADA'}"
                                    class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(facturas)}" class="sin-resultados">
            <p>No se encontraron facturas.</p>
        </div>
    </div>

</main>

<footer class="footer">
    <p>Sistema de Gestión Inmobiliaria &mdash; DESI 2026 &mdash; UTN FRSF</p>
</footer>

</body>
</html>
