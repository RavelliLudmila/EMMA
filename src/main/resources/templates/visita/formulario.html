<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${accion == 'alta' ? 'Nueva Visita' : 'Editar Visita'} + ' - Inmobiliaria'">Visita</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand"><span>🏠 Inmobiliaria</span></div>
    <ul class="navbar-menu">
        <li><a th:href="@{/propiedades}">Propiedades</a></li>
        <li><a th:href="@{/publicaciones}">Publicaciones</a></li>
        <li><a th:href="@{/visitas}" class="active">Visitas</a></li>
        <li><a th:href="@{/contratos}">Contratos</a></li>
        <li><a th:href="@{/incidentes}">Incidentes</a></li>
        <li><a th:href="@{/facturas}">Facturas</a></li>
    </ul>
</nav>

<main class="container">

    <div class="page-header">
        <h1 th:text="${accion == 'alta' ? 'Nueva Visita' : 'Editar Visita #' + visita.id}">Visita</h1>
        <a th:href="@{/visitas}" class="btn btn-outline">← Volver al listado</a>
    </div>

    <div th:if="${mensajeExito}" class="alerta alerta-exito" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alerta alerta-error" th:text="${mensajeError}"></div>

    <div class="card">
        <form th:action="${accion == 'alta' ? '/visitas/nueva' : '/visitas/' + visita.id + '/editar'}"
              method="post">

            <!-- ID solo lectura en edicion -->
            <div class="form-group" th:if="${accion == 'edicion'}">
                <label>ID Visita</label>
                <input type="text" class="form-control" th:value="${visita.id}" readonly/>
            </div>

            <!-- Publicacion -->
            <div class="form-group" th:if="${accion == 'alta'}">
                <label for="publicacionId">Publicacion <span class="requerido">*</span></label>
                <select id="publicacionId" name="publicacionId" class="form-control" required>
                    <option value="">-- Seleccione una publicacion activa --</option>
                    <option th:each="p : ${publicaciones}"
                            th:value="${p.id}"
                            th:text="${'#' + p.id + ' - ' + p.propiedad.direccion + ' ($' + p.precioMensual + '/mes)'}"
                            th:selected="${visita.publicacion != null and visita.publicacion.id == p.id}">
                    </option>
                </select>
            </div>

            <div class="form-group" th:if="${accion == 'edicion'}">
                <label>Publicacion</label>
                <input type="text" class="form-control"
                       th:value="${'#' + visita.publicacion.id + ' - ' + visita.publicacion.propiedad.direccion}"
                       readonly/>
            </div>

            <!-- Fecha y hora -->
            <div class="form-group">
                <label for="fechaHora">Fecha y hora <span class="requerido">*</span></label>
                <input type="datetime-local" id="fechaHora" name="fechaHora"
                       class="form-control"
                       th:value="${visita.fechaHora != null ? #temporals.format(visita.fechaHora, 'yyyy-MM-dd''T''HH:mm') : ''}"
                       required/>
            </div>

            <!-- Estado (solo en edicion) -->
            <div class="form-group" th:if="${accion == 'edicion'}">
                <label for="estado">Estado <span class="requerido">*</span></label>
                <select id="estado" name="estado" class="form-control" required>
                    <option th:each="e : ${estados}"
                            th:value="${e.name()}"
                            th:text="${e.descripcion}"
                            th:selected="${visita.estado == e}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"
                        th:text="${accion == 'alta' ? 'Registrar Visita' : 'Guardar Cambios'}">Guardar</button>
                <a th:href="@{/visitas}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>

</main>

<footer class="footer">
    <p>Sistema de Gestion Inmobiliaria &mdash; DESI 2026 &mdash; UTN FRSF</p>
</footer>

</body>
</html>
