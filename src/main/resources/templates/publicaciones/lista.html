<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Publicaciones</title>
</head>
<body>

<h1>Publicaciones</h1>

<div th:if="${error}" th:text="${error}" style="color:red;"></div>

<!-- Filtros HU 2.4 -->
<form method="get" th:action="@{/publicaciones}">
    <label>Propiedad:
        <select name="propiedadId">
            <option value="">Todas</option>
            <option th:each="p : ${propiedades}"
                    th:value="${p.id}"
                    th:text="${p.direccion}"
                    th:selected="${propiedadIdFiltro == p.id}"></option>
        </select>
    </label>
    <label>Ciudad:
        <select name="ciudadId">
            <option value="">Todas</option>
            <option th:each="c : ${ciudades}"
                    th:value="${c.id}"
                    th:text="${c.nombre}"
                    th:selected="${ciudadIdFiltro == c.id}"></option>
        </select>
    </label>
    <label>Estado:
        <select name="estadoPublicacion">
            <option value="">Todos</option>
            <option th:each="e : ${estados}"
                    th:value="${e}"
                    th:text="${e}"
                    th:selected="${estadoFiltro == e}"></option>
        </select>
    </label>
    <label>Precio min: <input type="number" name="precioMin" th:value="${precioMinFiltro}" step="0.01"/></label>
    <label>Precio max: <input type="number" name="precioMax" th:value="${precioMaxFiltro}" step="0.01"/></label>
    <button type="submit">Filtrar</button>
    <a th:href="@{/publicaciones}">Limpiar</a>
</form>

<br/>
<a th:href="@{/publicaciones/nueva}">+ Nueva publicacion</a>
<br/><br/>

<!-- Tabla HU 2.4 -->
<table border="1" cellpadding="5">
    <thead>
        <tr>
            <th>ID</th>
            <th>Direccion</th>
            <th>Ciudad</th>
            <th>Precio mensual</th>
            <th>Fecha publicacion</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="pub : ${publicaciones}">
            <td th:text="${pub.id}"></td>
            <td th:text="${pub.propiedad.direccion}"></td>
            <td th:text="${pub.propiedad.ciudad.nombre}"></td>
            <td th:text="${pub.precioMensual}"></td>
            <td th:text="${pub.fechaPublicacion}"></td>
            <td th:text="${pub.estadoPublicacion}"></td>
            <td>
                <a th:href="@{/publicaciones/editar/{id}(id=${pub.id})}">Modificar</a>
                &nbsp;
                <form th:action="@{/publicaciones/eliminar/{id}(id=${pub.id})}" method="post" style="display:inline;">
                    <button type="submit" onclick="return confirm('Eliminar esta publicacion?')">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(publicaciones)}">
            <td colspan="7">No hay publicaciones registradas.</td>
        </tr>
    </tbody>
</table>

</body>
</html>
