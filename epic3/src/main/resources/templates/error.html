<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" th:href="app.css">
</head>
<body>
<main class="shell">
    <section class="page-header">
        <div>
            <p class="eyebrow">Inmobiliaria</p>
            <h1>No se pudo completar la operacion</h1>
        </div>
    </section>
    <div class="alert error">
        <p th:text="${mensajeError}">Ocurrio un error.</p>
        <p th:if="${detalle}" th:text="${detalle}"></p>
    </div>
    <button class="link-button" th:href="@{/form}">Volver al alta</button>
</main>
</body>
</html>
